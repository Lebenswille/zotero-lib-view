name: Bump Version
on:
  workflow_dispatch:
    inputs:
      type:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
permissions:
  contents: write
concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bump:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          # PAT pushes trigger the check and release workflows.
          token: ${{ secrets.PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Update all version files
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.type }}
        run: node scripts/bump-version.cjs "$RELEASE_TYPE"
      - name: Validate versions
        run: node scripts/validate-release.cjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify release before tagging
        run: |
          npm run check
          npm audit
          npm run build
          npm run verify-build
      - name: Commit and tag verified release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json versions.json main.js
          git commit -m "Release $RELEASE_VERSION"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
      - name: Push commit and tag together
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_VERSION"
