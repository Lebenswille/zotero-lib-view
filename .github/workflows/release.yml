name: Release Obsidian Plugin
on:
  push:
    tags: ['*']
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release version
        run: node scripts/validate-release.cjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check source and dependencies
        run: |
          npm run check
          npm audit
      - name: Build and verify reproducibility
        run: |
          npm run build
          npm run verify-build
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --verify-tag --title "$RELEASE_TAG" --generate-notes --notes-file RELEASE_NOTES.md
